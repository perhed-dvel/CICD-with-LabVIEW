# This is a basic workflow to help you get started with Actions

name: CI - Test&Build

# Local variable holding the docker image
env:
  docker_image: nationalinstruments/labview:2026q3-windows
  
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    permissions: write-all
    # The type of runner that the job will run on
    runs-on: [self-hosted, windows, x64, runner-2]
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Pull the docker image
      - name: Pull LabVIEW container image
        run: docker pull $env:docker_image
                    
      # Build LabVIEW Executable via LabVIEWCLI
      - name: LabVIEW Build
        #shell: pwsh
        run: >
          docker run --rm
          -v "${{ github.workspace }}:C:\workspace"
          $env:docker_image
          LabVIEWCLI -LogToConsole TRUE -OperationName ExecuteBuildSpec
          -ProjectPath "C:\workspace\Source\LV_Calculator.lvproj" -BuildSpecName "LV_Calculator" -Headless
