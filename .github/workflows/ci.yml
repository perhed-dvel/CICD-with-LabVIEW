name: CI Pipeline

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  via-lv-docker:
    name: VI Analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run VI Analyzer
        uses: perhed-dvel/open-source/via-lv-docker@per-dev
        with:
          #config_path: '.github/via-config-linux.viancfg'
          docker_image: 'nationalinstruments/labview'
          labview_version: '2026q3-linux'

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vi-analyzer-report
          path: vi-analyzer-report.htm
          
  build_lvlibp:
    name: Build Packed Library
    needs: [via-lv-docker]
    runs-on: [self-hosted, windows, x64, runner-2]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Build Spec Docker Windows Action
        uses: perhed-dvel/open-source/build-spec-docker-windows@per-dev
        with:
          minimum_supported_lv_version: 2026
          supported_bitness: 64
          project_path: 'Source\LV_Calculator.lvproj'
          docker_image: 'prevas/labview'
          image_tag: '2026q3-windows-ci0'
          build_spec_name: 'Functions'
